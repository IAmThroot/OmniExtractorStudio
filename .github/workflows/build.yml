name: Build & Release OmniExtract Studio

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Release Version
        shell: python
        run: |
          import ast, os, pathlib
          tree = ast.parse(pathlib.Path('omniextract/__init__.py').read_text())
          version = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets))
          ref = os.environ.get('GITHUB_REF', '')
          if ref.startswith('refs/tags/'):
              assert ref == 'refs/tags/v' + version, (ref, version)

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/

      - name: Build Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "OmniExtract" --icon "OmniExtract.ico" --add-data "OmniExtract.png;." --add-data "OmniExtract.ico;." --add-data "assets;assets" extractor.py

      - name: Smoke Test Packaged Application
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          import subprocess
          subprocess.run(['dist/OmniExtract/OmniExtract.exe', '--smoke-test'], check=True, timeout=60)

      - name: Compress Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/OmniExtract/* -DestinationPath OmniExtract-Windows.zip
          Get-FileHash OmniExtract-Windows.zip -Algorithm SHA256 | Select-Object -ExpandProperty Hash > OmniExtract-Windows.zip.sha256

      - name: Upload Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: OmniExtract-Windows
          path: dist/OmniExtract

      - name: Upload to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OmniExtract-Windows.zip
            OmniExtract-Windows.zip.sha256

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Release Version
        shell: python
        run: |
          import ast, os, pathlib
          tree = ast.parse(pathlib.Path('omniextract/__init__.py').read_text())
          version = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets))
          ref = os.environ.get('GITHUB_REF', '')
          if ref.startswith('refs/tags/'):
              assert ref == 'refs/tags/v' + version, (ref, version)

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libegl1 libglx-mesa0 libpulse0 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/

      - name: Build AppImage
        run: |
          chmod +x build_appimage.sh AppRun
          ./build_appimage.sh
          sha256sum OmniExtract-x86_64.AppImage > OmniExtract-x86_64.AppImage.sha256

      - name: Upload Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: OmniExtract-Linux-AppImage
          path: OmniExtract-x86_64.AppImage

      - name: Upload to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OmniExtract-x86_64.AppImage
            OmniExtract-x86_64.AppImage.sha256
